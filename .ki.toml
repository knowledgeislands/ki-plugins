# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/ki-plugins"
title = "ki-plugins"
description = "Knowledge Islands Claude plugin marketplace — the Cowork-surface projection of ki-agentic-harness (skills + agents)."
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
visibility = "public" # Cowork's extraKnownMarketplaces GitHub source must reach it.

# The public proprietary projection intentionally retains its unresolved MIT-default license divergence.

[skills.ki-authoring]

